name: tests

# THIS REPOSITORY HAD NO CI AT ALL, and 589 tests nobody was running.
#
# Measured 2026-09-19 on `main`: `pytest -q` answers `589 passed, 248
# deselected in 4.21s`. The 248 are the windowed tests, which pyproject
# already keeps out of a default run — `addopts = ["-m", "not gui and not
# gui_integration"]` — so this gate opens no windows and needs no display.
# That exclusion is the repository's own and is not repeated here: a second
# copy of a rule is a second thing to forget.

on:
  push:
    branches: [main]
  pull_request:
  # A REPOSITORY NOBODY IS TOUCHING IS WHERE A NIGHTLY EARNS MOST. Nothing
  # here has a runner on anyone's machine, and the dependency set is torch,
  # torchvision, opencv and a pinned mlx — the things that break because
  # something ELSE was upgraded, which no commit causes and no path filter
  # matches. 04:23 rather than the hour: GitHub queues everything scheduled
  # on it.
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

# A literal prefix, not `github.workflow`. Measured on tsevis/Penelope
# 2026-09-16: three reusable workflows called from one nightly each computed
# `github.workflow` as the CALLER's name, landed in one group with
# `cancel-in-progress: true`, and cancelled each other one second in. There is
# one workflow here and no caller, so this is habit rather than necessity —
# but the habit costs nothing and the failure was silent.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest:
    # HOSTED macOS, AND NOT A CHOICE BETWEEN RUNNERS. `mlx==0.31.2` is pinned
    # in `dependencies` and builds only on Apple Silicon, so `uv sync` cannot
    # complete on a Linux runner at all. The collection does not IMPORT mlx —
    # measured: it loads torch, torchvision, cv2 and vtracer and nothing else —
    # but installing the declared set is what a lock file is for, and curating
    # a shorter one by hand is a list that drifts.
    #
    # And not a self-hosted Mac: this repository is public, so a fork's pull
    # request would run its author's code on the owner's machine. Free here —
    # measured 2026-09-16 across three sibling public repositories,
    # `/actions/runs/<id>/timing` answered `total_ms: 0` for UBUNTU, WINDOWS
    # and MACOS alike.
    runs-on: macos-15
    # Not a budget, a wall. The suite is four seconds; what this bounds is an
    # install that wedges, which is the failure dimitris had with no ceiling at
    # all and GitHub's own six-hour default behind it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # `--frozen`, so a lock that has drifted from pyproject FAILS here rather
      # than being silently re-resolved into something nobody reviewed.
      # `uv lock --check` passes on this commit: 133 packages.
      - name: Install the declared environment
        run: uv sync --frozen

      # THE GATES `scripts/verify.sh all` ALREADY RAN, AND CI DID NOT. That
      # script runs ruff, compileall, pip check and pip-audit alongside
      # pytest, so every one of them was enforced only by somebody
      # remembering to type it on the machine the code was written on — which
      # is the exact gap this workflow exists to close, and closing it for
      # pytest alone left the lint gate and the CVE check outside.
      #
      # NO RULE IS REPEATED HERE. The ruff rule set, its ignores and the
      # per-file exemptions for tests all live in `[tool.ruff]` in
      # pyproject.toml; this step only runs it. Same reason pytest's marker
      # exclusion is not restated above.
      #
      # Each gate is its own step. A single combined `run:` reports one red X
      # and makes you open the log to learn which of four things broke.
      - name: Lint
        run: uv run ruff check .

      # Catches a module that does not parse at all, including one nothing
      # imports: the default run deselects the windowed tests, so a syntax
      # error inside one of those is invisible to pytest here.
      - name: Byte-compile every module
        run: uv run python -m compileall -q .

      - name: Check the installed dependency graph
        run: uv run python -m pip check

      - name: Run the suite
        run: uv run pytest -q -p no:cacheprovider --durations=10

      # LAST, AND NOT GATED ON THE STEPS ABOVE. An advisory is published by
      # somebody else, on their schedule — it has no relation to whether this
      # commit's lint or tests pass, and it is what the nightly is mostly
      # here to catch. `!cancelled()` rather than `always()`: a cancelled run
      # should stay cancelled.
      #
      # It audits the INSTALLED environment, not the lock file, so it is
      # meaningful only after `uv sync --frozen` above. A local `.venv` that
      # has drifted from the lock reports packages the project no longer
      # declares.
      - name: Audit dependencies for known advisories
        if: ${{ !cancelled() }}
        run: uv run pip-audit
