[project]
name = "skiagrafia"
version = "0.3.1"
description = "Semantic vectorizing & masking creator"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "tkinterdnd2",
    "pillow",
    "opencv-python-headless",
    "numpy",
    "scipy",
    "pydantic>=2.0",
    "sqlitedict",
    "dask[distributed]",
    "tqdm",
    "rich",
    "cairosvg",
    "vtracer",
    "ollama",
    "lxml",
    "transformers",
    "accelerate",
    # Required by the Grounded-SAM-2 source packages (grounding_dino + sam2)
    "supervision",
    "addict",
    "yapf",
    "timm",
    "pycocotools",
    "hydra-core",
    "iopath",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat layout: the launcher is a top-level module, not inside a package.
py-modules = ["main"]

[tool.setuptools.packages.find]
# Declared explicitly — auto-discovery cannot tell the source packages apart
# from output/scratch directories in a flat layout.
include = ["core*", "models*", "processors*", "ui*", "utils*"]

[tool.pytest.ini_options]
# GUI tests construct real windows on the developer's desktop; they are
# opt-in only. Run them deliberately with: pytest -m gui
addopts = ["-m", "not gui"]
markers = ["gui: opens real windows; excluded from the default run"]
