[project]
name = "skiagrafia"
version = "0.4.0"
description = "Semantic vectorizing & masking creator"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch",
    "torchvision",
    "tkinterdnd2",
    "pillow",
    "opencv-python-headless",
    "numpy",
    "scipy",
    "pydantic>=2.0",
    "dask[distributed]",
    "tqdm",
    "rich",
    "cairosvg",
    "vtracer",
    "ollama",
    "lxml",
    # MLX SAM 3's locally bundled source imports these at inference time.
    # Keep the runtime dependency set explicit instead of relying on a
    # separately installed model-source environment.
    # The bundled SAM 3 custom Metal kernel targets MLX 0.31's callable
    # kernel contract.  Pin it until its source is updated and re-verified
    # against a newer MLX API.
    "mlx==0.31.2",
    "ftfy>=6.3.1",
    # GroundingDINO's BERT wrapper needs a small compatibility shim for the
    # removed mask helper in transformers 5; use a patched supported line.
    "transformers>=5.10,<6",
    "accelerate",
    # Required by the Grounded-SAM-2 source packages (grounding_dino + sam2)
    "supervision",
    "addict",
    "yapf",
    "timm",
    "pycocotools",
    "hydra-core",
    "iopath",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat layout: the launcher is a top-level module, not inside a package.
py-modules = ["main"]

[tool.setuptools.packages.find]
# Declared explicitly — auto-discovery cannot tell the source packages apart
# from output/scratch directories in a flat layout.
include = ["core*", "models*", "processors*", "ui*", "utils*"]

[tool.setuptools.package-data]
"core.presets" = ["*.toml"]

[tool.pytest.ini_options]
# Windowed tests construct real windows on the developer's desktop.  Keep the
# daily smoke gate deliberately small; run the complete windowed suite only
# before a release or commit with: pytest -m "gui or gui_integration".
addopts = ["-m", "not gui and not gui_integration"]
markers = [
    "gui: fast real-window smoke test; the fast set stays under five seconds",
    "gui_integration: full real-window integration test; excluded from the default and smoke runs",
]

[tool.ruff]
# scripts/verify.sh runs `ruff check .` as a gate.  Without this section ruff
# falls back to whatever config the machine happens to carry, so the gate
# passes or fails depending on the developer rather than on the code.
target-version = "py313"
line-length = 100
exclude = ["models/vendor", "skiagrafia_out"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",  # ruff's default correctness set
    "I",                    # import ordering
    "UP",                   # syntax that 3.13 supersedes
    "B",                    # bugbear: real traps, not style
    "C4", "SIM", "RET",     # comprehension/branch simplification
    "G", "LOG",             # logging call correctness
    "DTZ",                  # naive datetimes
    "S",                    # bandit ruleset; the security gate lives here
    "TRY004",               # wrong exception type for a type check
    "RUF",
]
ignore = [
    "RUF059",  # unused unpacked variable -- fires on deliberate tuple unpacking
    "PYI063",  # positional-only stub style; this project ships no stubs
    # This codebase writes real typography: en dashes in prose, curly quotes in
    # user-facing strings.  Both are intentional, not lookalike mistakes.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, build fixtures from literals, and bind names purely to keep a
# context object alive; none of that is a finding in a test.
# S314: the SVG a test parses is the one the test just built.
"tests/*" = ["S101", "S105", "S106", "S108", "S311", "S314"]

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3.0",
    "pyright>=1.1.400,<2",
    "pytest>=9.0.3,<10",
    "ruff==0.15.2",
]

[tool.pyright]
# basic, not strict. The pipeline passes numpy arrays and torch tensors
# through several layers and strict would demand annotations on library
# surfaces this project does not own. basic catches the errors that are
# errors: a name that does not exist, an argument that cannot match, a None
# that is not handled.
typeCheckingMode = "basic"
pythonVersion = "3.13"
# Without these pyright resolves against its own interpreter and reports
# numpy, torch, pydantic and cv2 as missing -- 97 phantom import errors, and
# several hundred attribute errors cascading off them.
venvPath = "."
venv = ".venv"
# Vendored model source is not this project's code to annotate, and the
# output directory is not code at all.
exclude = [
    "models/vendor",
    "skiagrafia_out",
    "**/__pycache__",
    ".venv",
]
