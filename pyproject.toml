[project]
name = "skiagrafia"
version = "0.3.1"
description = "Semantic vectorizing & masking creator"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch",
    "torchvision",
    "tkinterdnd2",
    "pillow",
    "opencv-python-headless",
    "numpy",
    "scipy",
    "pydantic>=2.0",
    "sqlitedict",
    "dask[distributed]",
    "tqdm",
    "rich",
    "cairosvg",
    "vtracer",
    "ollama",
    "lxml",
    # MLX SAM 3's locally bundled source imports these at inference time.
    # Keep the runtime dependency set explicit instead of relying on a
    # separately installed model-source environment.
    # The bundled SAM 3 custom Metal kernel targets MLX 0.31's callable
    # kernel contract.  Pin it until its source is updated and re-verified
    # against a newer MLX API.
    "mlx==0.31.2",
    "ftfy>=6.3.1",
    # GroundingDINO's BERT wrapper needs a small compatibility shim for the
    # removed mask helper in transformers 5; use a patched supported line.
    "transformers>=5.10,<6",
    "accelerate",
    # Required by the Grounded-SAM-2 source packages (grounding_dino + sam2)
    "supervision",
    "addict",
    "yapf",
    "timm",
    "pycocotools",
    "hydra-core",
    "iopath",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat layout: the launcher is a top-level module, not inside a package.
py-modules = ["main"]

[tool.setuptools.packages.find]
# Declared explicitly — auto-discovery cannot tell the source packages apart
# from output/scratch directories in a flat layout.
include = ["core*", "models*", "processors*", "ui*", "utils*"]

[tool.setuptools.package-data]
"core.presets" = ["*.toml"]

[tool.pytest.ini_options]
# Windowed tests construct real windows on the developer's desktop.  Keep the
# daily smoke gate deliberately small; run the complete windowed suite only
# before a release or commit with: pytest -m "gui or gui_integration".
addopts = ["-m", "not gui and not gui_integration"]
markers = [
    "gui: fast real-window smoke test; the fast set stays under five seconds",
    "gui_integration: full real-window integration test; excluded from the default and smoke runs",
]
# find_incomplete_batches deliberately opens a corrupt state.db to prove it
# skips one. sqlitedict connects from a daemon writer thread, so the failure
# also surfaces there, asynchronously -- pytest blames whichever test happens
# to be running, which is why this cannot be scoped per-test. Matched on the
# sqlite message so any other unhandled thread exception still fails loudly.
filterwarnings = [
    "ignore:(?s).*file is not a database.*:pytest.PytestUnhandledThreadExceptionWarning",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3.0",
    "pytest>=9.0.3,<10",
    "ruff==0.15.2",
]
