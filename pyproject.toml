[project]
name = "skiagrafia"
version = "0.3.1"
description = "Semantic vectorizing & masking creator"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "tkinterdnd2",
    "pillow",
    "opencv-python-headless",
    "numpy",
    "scipy",
    "pydantic>=2.0",
    "sqlitedict",
    "dask[distributed]",
    "tqdm",
    "rich",
    "cairosvg",
    "vtracer",
    "ollama",
    "lxml",
    "transformers",
    "accelerate",
    # Required by the Grounded-SAM-2 source packages (grounding_dino + sam2)
    "supervision",
    "addict",
    "yapf",
    "timm",
    "pycocotools",
    "hydra-core",
    "iopath",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
