[domain]
name = "Apple — The First 50 Years"
description = "Historical editorial imagery about Apple Inc. from 1976 to 2026. The collection includes Apple computers, consumer devices, prototypes, peripherals, circuit boards, packaging, logos, retail environments, offices, historical documents, advertisements, diagrams, and people associated with Apple."
exclusions = ["captions", "headlines", "paragraphs", "printed text", "diagrams", "charts", "screenshots", "photographs printed inside another photograph", "page backgrounds", "decorative borders"]

[batch_defaults]
enable_tiling = true
max_aliases_per_object = 4

[[objects]]
canonical = "Apple computer"
aliases = ["Apple desktop computer", "Apple personal computer"]
generic_terms = ["computer", "desktop computer"]
description = "Apple computer hardware shown as a standalone physical product"
parts = ["screen", "buttons", "ports", "speakers", "casing", "cables", "connectors", "circuit board", "removable accessory"]
detector_phrases = ["Apple computer", "desktop computer"]

[[objects]]
canonical = "Macintosh computer"
aliases = ["Mac", "Macintosh"]
generic_terms = ["computer", "desktop computer"]
description = "historical Apple Macintosh computer"
parts = ["screen", "buttons", "ports", "speakers", "casing", "cables", "connectors"]
detector_phrases = ["Macintosh computer", "Mac computer"]

